name: Backend CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  SERVICE_NAME: ai-test-case-generator-backend
  ARTIFACT_REGISTRY_REPO: ai-test-case-generator
  IMAGE_NAME: backend

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run linting
      run: |
        pip install flake8 black isort
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Check code formatting
        black --check --diff .
        # Check import sorting
        isort --check-only --diff .

    - name: Run unit tests
      run: |
        python -m pytest tests/ -v --tb=short
      env:
        # Mock environment variables for testing
        GOOGLE_API_KEY: test_key
        GOOGLE_CLOUD_PROJECT: test_project
        GDPR_COMPLIANT: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Run safety check for vulnerabilities
      run: safety check --json || true

    - name: Run bandit security linter
      run: bandit -r . -f json || true

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./backend

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker to use gcloud as a credential helper
      run: gcloud auth configure-docker $REGION-docker.pkg.dev

    - name: Get secrets from Secret Manager
      id: secrets
      run: |
        echo "GOOGLE_API_KEY=$(gcloud secrets versions access latest --secret="google-api-key")" >> $GITHUB_OUTPUT
        echo "JIRA_API_TOKEN=$(gcloud secrets versions access latest --secret="jira-api-token" || echo "")" >> $GITHUB_OUTPUT
        echo "JIRA_URL=$(gcloud secrets versions access latest --secret="jira-url" || echo "")" >> $GITHUB_OUTPUT
        echo "JIRA_USERNAME=$(gcloud secrets versions access latest --secret="jira-username" || echo "")" >> $GITHUB_OUTPUT
        echo "AZURE_DEVOPS_PAT=$(gcloud secrets versions access latest --secret="azure-devops-pat" || echo "")" >> $GITHUB_OUTPUT
        echo "AZURE_DEVOPS_URL=$(gcloud secrets versions access latest --secret="azure-devops-url" || echo "")" >> $GITHUB_OUTPUT
        echo "AZURE_DEVOPS_PROJECT=$(gcloud secrets versions access latest --secret="azure-devops-project" || echo "")" >> $GITHUB_OUTPUT
        echo "POLARION_PASSWORD=$(gcloud secrets versions access latest --secret="polarion-password" || echo "")" >> $GITHUB_OUTPUT
        echo "POLARION_URL=$(gcloud secrets versions access latest --secret="polarion-url" || echo "")" >> $GITHUB_OUTPUT
        echo "POLARION_USERNAME=$(gcloud secrets versions access latest --secret="polarion-username" || echo "")" >> $GITHUB_OUTPUT
        echo "POLARION_PROJECT_ID=$(gcloud secrets versions access latest --secret="polarion-project-id" || echo "")" >> $GITHUB_OUTPUT
        echo "GDPR_SECRET_KEY=$(gcloud secrets versions access latest --secret="gdpr-secret-key" || echo "")" >> $GITHUB_OUTPUT
        echo "PUBLIC_API_KEY=$(gcloud secrets versions access latest --secret="public-api-key" || echo "")" >> $GITHUB_OUTPUT
        echo "AGENT_API_KEY=$(gcloud secrets versions access latest --secret="agent-api-key" || echo "")" >> $GITHUB_OUTPUT

    - name: Build Docker image
      run: |
        docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from $REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY_REPO/$IMAGE_NAME:latest \
          -t $REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY_REPO/$IMAGE_NAME:$GITHUB_SHA \
          -t $REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY_REPO/$IMAGE_NAME:latest \
          .

    - name: Push Docker image
      run: |
        docker push $REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY_REPO/$IMAGE_NAME:$GITHUB_SHA
        docker push $REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY_REPO/$IMAGE_NAME:latest

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image $REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY_REPO/$IMAGE_NAME:$GITHUB_SHA \
          --region $REGION \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars="GOOGLE_API_KEY=${{ steps.secrets.outputs.GOOGLE_API_KEY }}" \
          --set-env-vars="GOOGLE_CLOUD_PROJECT=$PROJECT_ID" \
          --set-env-vars="GCS_BUCKET_NAME=$PROJECT_ID-knowledge-base" \
          --set-env-vars="GENAI_MODEL=gemini-2.5-flash" \
          --set-env-vars="GENAI_VISION_MODEL=gemini-2.5-pro" \
          --set-env-vars="JIRA_API_TOKEN=${{ steps.secrets.outputs.JIRA_API_TOKEN }}" \
          --set-env-vars="JIRA_URL=${{ steps.secrets.outputs.JIRA_URL }}" \
          --set-env-vars="JIRA_USERNAME=${{ steps.secrets.outputs.JIRA_USERNAME }}" \
          --set-env-vars="AZURE_DEVOPS_PAT=${{ steps.secrets.outputs.AZURE_DEVOPS_PAT }}" \
          --set-env-vars="AZURE_DEVOPS_URL=${{ steps.secrets.outputs.AZURE_DEVOPS_URL }}" \
          --set-env-vars="AZURE_DEVOPS_PROJECT=${{ steps.secrets.outputs.AZURE_DEVOPS_PROJECT }}" \
          --set-env-vars="POLARION_PASSWORD=${{ steps.secrets.outputs.POLARION_PASSWORD }}" \
          --set-env-vars="POLARION_URL=${{ steps.secrets.outputs.POLARION_URL }}" \
          --set-env-vars="POLARION_USERNAME=${{ steps.secrets.outputs.POLARION_USERNAME }}" \
          --set-env-vars="POLARION_PROJECT_ID=${{ steps.secrets.outputs.POLARION_PROJECT_ID }}" \
          --set-env-vars="GDPR_SECRET_KEY=${{ steps.secrets.outputs.GDPR_SECRET_KEY }}" \
          --set-env-vars="PUBLIC_API_KEY=${{ steps.secrets.outputs.PUBLIC_API_KEY }}" \
          --set-env-vars="AGENT_API_KEY=${{ steps.secrets.outputs.AGENT_API_KEY }}" \
          --memory 2Gi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 10 \
          --concurrency 80 \
          --timeout 300 \
          --port 8000

    - name: Get Cloud Run URL
      id: deploy
      run: |
        SERVICE_URL=$(gcloud run services describe $SERVICE_NAME --region=$REGION --format='value(status.url)')
        echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT
        echo "Backend deployed to: $SERVICE_URL"

    - name: Run smoke tests
      run: |
        # Wait for service to be ready
        sleep 30
        # Basic health check
        curl -f ${{ steps.deploy.outputs.SERVICE_URL }}/health || exit 1
        echo "Smoke tests passed!"
