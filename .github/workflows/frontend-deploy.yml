name: Frontend CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'

env:
  NODE_VERSION: '18'
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  test:
    name: Run Tests and Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint || true  # Don't fail on linting errors for now

    # TODO: Add tests and uncomment the following step
    # - name: Run tests
    #   run: npm test -- --coverage --watchAll=false
    #   env:
    #     CI: true

    # TODO: Uncomment when tests are added
    # - name: Upload coverage reports
    #   uses: codecov/codecov-action@v3
    #   with:
    #     directory: ./frontend/coverage
    #     flags: frontend
    #     name: frontend-coverage

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: npm audit --audit-level=high

    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
        command: test

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./frontend

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Get backend URL and Firebase config from Secret Manager
      id: config
      run: |
        BACKEND_URL=$(gcloud run services describe ai-test-case-generator-backend --region=asia-south1 --format='value(status.url)')
        echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_OUTPUT
        echo "Backend URL: $BACKEND_URL"
        
        # Get Firebase configuration from Secret Manager
        echo "FIREBASE_API_KEY=$(gcloud secrets versions access latest --secret="firebase-api-key" || echo "")" >> $GITHUB_OUTPUT
        echo "FIREBASE_AUTH_DOMAIN=$(gcloud secrets versions access latest --secret="firebase-auth-domain" || echo "$FIREBASE_PROJECT_ID.firebaseapp.com")" >> $GITHUB_OUTPUT
        echo "FIREBASE_STORAGE_BUCKET=$(gcloud secrets versions access latest --secret="firebase-storage-bucket" || echo "$FIREBASE_PROJECT_ID.appspot.com")" >> $GITHUB_OUTPUT
        echo "FIREBASE_MESSAGING_SENDER_ID=$(gcloud secrets versions access latest --secret="firebase-messaging-sender-id" || echo "")" >> $GITHUB_OUTPUT
        echo "FIREBASE_APP_ID=$(gcloud secrets versions access latest --secret="firebase-app-id" || echo "")" >> $GITHUB_OUTPUT

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        REACT_APP_BACKEND_URL: ${{ steps.config.outputs.BACKEND_URL }}
        REACT_APP_FIREBASE_API_KEY: ${{ steps.config.outputs.FIREBASE_API_KEY }}
        REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ steps.config.outputs.FIREBASE_AUTH_DOMAIN }}
        REACT_APP_FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
        REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ steps.config.outputs.FIREBASE_STORAGE_BUCKET }}
        REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ steps.config.outputs.FIREBASE_MESSAGING_SENDER_ID }}
        REACT_APP_FIREBASE_APP_ID: ${{ steps.config.outputs.FIREBASE_APP_ID }}
        GENERATE_SOURCEMAP: false
        CI: false  # Treat warnings as warnings, not errors

    - name: Run build analysis
      run: |
        # Check build size
        du -sh build/
        # List largest files
        find build/ -type f -name "*.js" -o -name "*.css" | xargs ls -lah | sort -k5 -hr | head -10

    - name: Set up Firebase CLI
      run: |
        npm install -g firebase-tools

    - name: Deploy to Firebase Hosting
      run: |
        firebase deploy --only hosting --project $FIREBASE_PROJECT_ID --non-interactive
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    - name: Get Firebase Hosting URL
      id: deploy
      run: |
        HOSTING_URL="https://$FIREBASE_PROJECT_ID.web.app"
        echo "HOSTING_URL=$HOSTING_URL" >> $GITHUB_OUTPUT
        echo "Frontend deployed to: $HOSTING_URL"

    - name: Run smoke tests
      run: |
        # Wait for deployment to propagate
        sleep 60
        # Basic connectivity test
        curl -f ${{ steps.deploy.outputs.HOSTING_URL }} || exit 1
        echo "Smoke tests passed!"

    - name: Update Cloud Run CORS settings
      run: |
        # Update backend to allow the new frontend URL
        gcloud run services update ai-test-case-generator-backend \
          --region=asia-south1 \
          --set-env-vars="FRONTEND_ORIGIN=${{ steps.deploy.outputs.HOSTING_URL }}"
