# Backend Cloud Build Configuration
# This configuration is used for manual builds via gcloud builds submit
# For automated CI/CD, use GitHub Actions workflows

steps:
# Install dependencies and run tests
- name: 'python:3.11-slim'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    pip install --no-cache-dir -r requirements.txt
    pip install flake8 black isort safety bandit
    
    # Run linting
    flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    black --check .
    isort --check-only .
    
    # Run security checks
    safety check || true
    bandit -r . -f json || true
    
    # Run tests
    python -m pytest tests/ -v
  env:
  - 'GOOGLE_API_KEY=test_key'
  - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
  - 'GDPR_COMPLIANT=false'

# Build Docker image with caching
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '--cache-from'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/ai-test-case-generator/backend:latest'
  - '-t'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/ai-test-case-generator/backend:$COMMIT_SHA'
  - '-t'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/ai-test-case-generator/backend:latest'
  - '.'

# Push images to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '--all-tags', 'asia-south1-docker.pkg.dev/$PROJECT_ID/ai-test-case-generator/backend']

# Deploy to Cloud Run with secrets from Secret Manager
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    gcloud run deploy ai-test-case-generator-backend \
      --image asia-south1-docker.pkg.dev/$PROJECT_ID/ai-test-case-generator/backend:$COMMIT_SHA \
      --region asia-south1 \
      --platform managed \
      --allow-unauthenticated \
      --memory 2Gi \
      --cpu 1 \
      --min-instances 0 \
      --max-instances 10 \
      --concurrency 80 \
      --timeout 300 \
      --port 8000 \
      --set-env-vars="GOOGLE_CLOUD_PROJECT=$PROJECT_ID" \
      --set-env-vars="GCS_BUCKET_NAME=$PROJECT_ID-knowledge-base" \
      --set-env-vars="GENAI_MODEL=gemini-2.5-flash" \
      --set-env-vars="GENAI_VISION_MODEL=gemini-2.5-pro" \
      --update-secrets="GOOGLE_API_KEY=google-api-key:latest" \
      --update-secrets="JIRA_API_TOKEN=jira-api-token:latest" \
      --update-secrets="JIRA_URL=jira-url:latest" \
      --update-secrets="JIRA_USERNAME=jira-username:latest" \
      --update-secrets="AZURE_DEVOPS_PAT=azure-devops-pat:latest" \
      --update-secrets="AZURE_DEVOPS_URL=azure-devops-url:latest" \
      --update-secrets="AZURE_DEVOPS_PROJECT=azure-devops-project:latest" \
      --update-secrets="POLARION_PASSWORD=polarion-password:latest" \
      --update-secrets="POLARION_URL=polarion-url:latest" \
      --update-secrets="POLARION_USERNAME=polarion-username:latest" \
      --update-secrets="POLARION_PROJECT_ID=polarion-project-id:latest" \
      --update-secrets="GDPR_SECRET_KEY=gdpr-secret-key:latest" \
      --update-secrets="PUBLIC_API_KEY=public-api-key:latest" \
      --update-secrets="AGENT_API_KEY=agent-api-key:latest"

# Run smoke test
- name: 'gcr.io/cloud-builders/curl'
  args:
  - '-f'
  - 'https://ai-test-case-generator-backend-$(gcloud config get-value project).a.run.app/health'

images:
- 'asia-south1-docker.pkg.dev/$PROJECT_ID/ai-test-case-generator/backend:$COMMIT_SHA'
- 'asia-south1-docker.pkg.dev/$PROJECT_ID/ai-test-case-generator/backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_STANDARD_4'  # Balanced performance/cost
  
timeout: '1200s'  # 20 minutes
